name: TruthShorts Autopilot

on:
  schedule:
    - cron: "15 01 * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          pip install -r requirements.txt

      - name: Run autopilot
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python main.py

      - name: Commit updated history
        run: |
          git config user.name "truthshorts-bot"
          git config user.email "truthshorts-bot@users.noreply.github.com"
          git add data/history.json || true
          git commit -m "Update history" || echo "No changes"
          git push || echo "No push"
